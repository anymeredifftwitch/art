name: Publish Daily YouTube Short

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Visibilité du Short'
        required: true
        type: choice
        default: 'private'
        options:
          - private
          - public
          - unlisted
      max_clips:
        description: 'Nombre max de clips à publier'
        required: false
        type: number
        default: 1
  schedule:
    - cron: '0 13 * * *'

jobs:
  publish-short:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-${{ runner.os }}-v1

      - name: Install system dependencies (ffmpeg, ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Configure ImageMagick policy
        run: |
          POLICY_FILE="/etc/ImageMagick-6/policy.xml"
          sudo cp $POLICY_FILE ${POLICY_FILE}.bak
          sudo sed -i 's#<policy domain=".*" rights="none" pattern=".*"/>#<policy domain="coder" rights="read|write" pattern="*" />#g' $POLICY_FILE

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      # Création des fichiers de credentials pour YouTube
      - name: Create client_secret.json
        run: echo '${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Create token.json
        run: echo '${{ secrets.YOUTUBE_API_TOKEN_JSON }}' > token.json

      - name: Run main script
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python main.py --privacy public
          else
            python main.py --privacy ${{ github.event.inputs.privacy }} --max-clips ${{ github.event.inputs.max_clips }}
          fi
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_APPLICATION_CREDENTIALS: client_secret.json
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload processed video
        uses: actions/upload-artifact@v4
        with:
          name: processed-short
          path: data/*_processed.mp4
          if-no-files-found: warn
